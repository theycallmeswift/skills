[project]
name = "<name>"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ANN", "B", "D", "E", "F", "I", "N", "PTH", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# A test's name states its behavior; a docstring would repeat it.
"test/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "--strict-markers --import-mode=importlib"
