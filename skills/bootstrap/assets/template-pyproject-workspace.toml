# Workspace root: one lockfile and one set of dev tools for every Python
# package. Each member keeps its own pyproject.toml.
[tool.uv.workspace]
members = ["<dir>"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# The current stage of the lint ramp. The full house set is
# ["ANN", "B", "D", "E", "F", "I", "N", "PTH", "RUF", "SIM", "UP", "W"].
select = [<stage>]

[tool.ruff.lint.per-file-ignores]
# A test's name states its behavior; a docstring would repeat it.
"**/test/**" = ["D"]
"**/tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "--strict-markers --import-mode=importlib"
