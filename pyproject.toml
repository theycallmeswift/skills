[project]
name = "mechaswift"
version = "0.1.0"
description = "MechaSwift — Swift's agent brain. Skills, tools, and prompts for Claude Code and Hermes."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.6",
]
# Opt-in: `uv sync --group evals`. harnessbench is a private, pre-release git dependency;
# see docs/development.md.
evals = [
    "harnessbench[microsandbox]",
    "pytest-repeat>=0.9,<1",  # --count N sampling; <1 because harnessbench reads its internal step param
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.sources]
harnessbench = { git = "https://github.com/theycallmeswift/harnessbench.git", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Skill evals (harnessbench). Discovery walks skills/ for eval.md / *.eval.md. Each skill keeps
# output evals in evals/<slug>/ and routing evals in evals/<skill>-triggers/. See docs/development.md.
[tool.harnessbench]
default-set = "default"
eval_paths = ["skills"]

# Output evals: what the skill teaches. baseline installs nothing; trial installs the skill.
[tool.harnessbench.sets.default]
harness = "claude-code"
model = "sonnet"
baseline = "baseline"
arms = [
  { name = "baseline" },
  { name = "trial" },
]

# Trigger evals: does the description route? One arm running the whole plugin from the staged
# repo, so each skill competes with its real peers — a baseline can't fire a skill it doesn't
# have. opus routes the synthesize-context phrasings that sonnet under-triggers.
[tool.harnessbench.sets.triggers]
harness = "claude-code"
model = "opus"
harness_args = ["--plugin-dir", "/project"]
arms = [
  { name = "trial" },
]
