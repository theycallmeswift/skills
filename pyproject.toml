[project]
name = "mechaswift"
version = "0.1.0"
description = "MechaSwift — Swift's agent brain. Skills, tools, and prompts for Claude Code and Hermes."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.6",
    "ty>=0.0.82",
]
# Opt-in: the eval runner lives in its own group so `make install` stays pytest + ruff.
# `uv run --group evals …` syncs it on demand; see docs/development.md.
evals = [
    "benchspec[microsandbox]>=0.0.5,<0.1",
    "pytest-repeat>=0.9,<1",  # --count N sampling; <1 because benchspec reads its internal step param
]

[tool.uv]
package = false
default-groups = ["dev"]

# Frontmatter params a SKILL.md may declare without tests/test_plugin.py warning. Unset, as here,
# the allowlist is ["name", "description"]: portable, read by every harness, and both required.
# Every other param is honored by some harnesses and dropped by others, so allowing one asserts it
# is deliberate and covered by evals in both directions — a harness that honors it, and one that
# drops it. The check warns rather than fails; pytest's filterwarnings mutes the class outright.
#
# Uncomment to allow a param for every skill:
#
#   [tool.mechaswift]
#   allowed_skill_frontmatter_params = ["name", "description", "context"]
#
# Or for one skill only, extending the repo-wide list (name and description need no restating):
#
#   [tool.mechaswift.skills.to-spec]
#   allowed_skill_frontmatter_params = ["context", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: calls a real external service; opt in with `make test:e2e`"]

# Tests import each skill's scripts/ as top-level modules; tests/skills/conftest.py puts them on
# sys.path at runtime, and ty needs the same search paths to resolve them.
[tool.ty.environment]
root = ["."]
extra-paths = ["tests", "skills/delegating-to-codex/scripts", "skills/to-spec/scripts"]

[tool.ty.src]
# Eval workspaces are fixture code the agent edits during a run, not code we maintain.
exclude = ["evals/*/*/workspace"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Skill evals (benchspec). Discovery walks evals/ for eval.md / *.eval.md: evals/<skill>/<scenario>/
# eval.md is an output eval, evals/<skill>/{triggers,not-triggers}/<query>.eval.md a routing eval. See docs/development.md.
[tool.benchspec]
default-set = "default"
eval_paths = ["evals"]

# baseline runs the agent bare; trial loads the whole plugin from the staged repo, so output
# evals measure what the plugin taught and routing evals compete each description with its peers.
[tool.benchspec.sets.default]
harness = "claude-code"
model = "sonnet"
baseline = "baseline"
arms = [
  { name = "baseline" },
  { name = "trial", harness_args = ["--plugin-dir", "/project"] },
]
