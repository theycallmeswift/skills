[project]
name = "mechaswift"
version = "0.1.0"
description = "Mike Swift's personal agent framework — skills, configuration, and workflows."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "rich>=13.7.0",
]

[dependency-groups]
dev = [
    "dspy>=2.5",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that make multiple LLM calls"]
addopts = "-n auto --dist loadscope"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "examples", "tmp", "*-workspace"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
