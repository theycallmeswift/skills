[project]
name = "mechaswift"
version = "0.1.0"
description = "MechaSwift — Swift's agent brain. Skills, tools, and prompts for Claude Code and Hermes."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.6",
]
# Opt-in: `uv sync --group evals`. harnessbench is a private, pre-release git dependency;
# see docs/development.md.
evals = [
    "harnessbench[microsandbox]",
    "pytest-repeat>=0.9,<1",  # --count N sampling; <1 because harnessbench reads its internal step param
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.sources]
harnessbench = { git = "https://github.com/theycallmeswift/harnessbench.git", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Skill evals (harnessbench). Discovery walks evals/ for eval.md / *.eval.md: evals/<skill>/<scenario>/
# eval.md is an output eval, evals/<skill>/<query>.eval.md a routing eval. See docs/development.md.
[tool.harnessbench]
default-set = "default"
eval_paths = ["evals"]

# baseline runs the agent bare; trial loads the whole plugin from the staged repo, so output
# evals measure what the plugin taught and routing evals compete each description with its peers.
[tool.harnessbench.sets.default]
harness = "claude-code"
model = "sonnet"
baseline = "baseline"
arms = [
  { name = "baseline" },
  { name = "trial", harness_args = ["--plugin-dir", "/project"] },
]
