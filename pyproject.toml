[project]
name = "mechaswift"
version = "0.1.0"
description = "MechaSwift — Swift's agent brain. Skills, tools, and prompts for Claude Code and Hermes."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.6",
]
# The eval runner (harnessbench) is a private git dependency and deliberately NOT declared here:
# uv resolves every group on sync, so a private source would break `make install` for anyone
# without access, CI included. `make evals:install` puts it in the venv; see docs/development.md.

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Skill evals (harnessbench). Discovery walks evals/ for eval.md / *.eval.md: evals/<skill>/<scenario>/
# eval.md is an output eval, evals/<skill>/<query>.eval.md a routing eval. See docs/development.md.
[tool.harnessbench]
default-set = "default"
eval_paths = ["evals"]

# baseline runs the agent bare; trial loads the whole plugin from the staged repo, so output
# evals measure what the plugin taught and routing evals compete each description with its peers.
[tool.harnessbench.sets.default]
harness = "claude-code"
model = "sonnet"
baseline = "baseline"
arms = [
  { name = "baseline" },
  { name = "trial", harness_args = ["--plugin-dir", "/project"] },
]
