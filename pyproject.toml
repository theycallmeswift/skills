[project]
name = "mechaswift"
version = "0.1.0"
description = "Mike Swift's personal agent framework — skills, configuration, and workflows."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "rich>=13.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "examples", "tmp", "*-workspace"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
