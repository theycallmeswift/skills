[project]
name = "mechaswift"
version = "0.1.0"
description = "MechaSwift — Swift's agent brain. Skills, tools, and prompts for Claude Code and Hermes."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.6",
]
# Opt-in: the eval runner lives in its own group so `make install` stays pytest + ruff.
# `uv run --group evals …` syncs it on demand; see docs/development.md.
evals = [
    "benchspec[microsandbox]>=0.0.4,<0.1",
    "pytest-repeat>=0.9,<1",  # --count N sampling; <1 because benchspec reads its internal step param
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: calls a real external service; opt in with `make test:e2e`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Skill evals (benchspec). Discovery walks evals/ for eval.md / *.eval.md: evals/<skill>/<scenario>/
# eval.md is an output eval, evals/<skill>/{triggers,not-triggers}/<query>.eval.md a routing eval. See docs/development.md.
[tool.benchspec]
default-set = "default"
eval_paths = ["evals"]

# baseline runs the agent bare; trial loads the whole plugin from the staged repo, so output
# evals measure what the plugin taught and routing evals compete each description with its peers.
[tool.benchspec.sets.default]
harness = "claude-code"
model = "sonnet"
baseline = "baseline"
arms = [
  { name = "baseline" },
  { name = "trial", harness_args = ["--plugin-dir", "/project"] },
]
