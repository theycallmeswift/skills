name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
      - dev

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: make install
      - name: Lint
        run: make lint
      - name: Validate plugin manifests and skills
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: make install
      - name: Test
        run: make test
